[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-git-memory"
version = "0.2.0"
description = "Shared project memory for coding assistants, scoped by verified Git history"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
live = ["falkordb==1.2.0"]

[project.scripts]
hivemind = "hivemind.__main__:main"

[tool.setuptools]
packages = ["hivemind"]
include-package-data = true

[tool.setuptools.package-data]
hivemind = ["opencode_plugin.mjs"]

[tool.setuptools.data-files]
"share/hivemind/web" = ["web/index.html", "web/app.js", "web/styles.css"]
